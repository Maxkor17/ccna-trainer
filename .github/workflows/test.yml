name: Тести (pull request)

on:
  pull_request:
  push:
    branches-ignore: [main]   # для main тести запускає deploy.yml перед деплоєм

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Перевірка синтаксису
        run: for f in public/*.js; do node --check "$f" || exit 1; done
      - name: public/cli.js зібрано з src/cli
        run: node scripts/build-cli.mjs --check
      - name: Автотести (банки, генератори, лаби, API)
        run: node tests/run.js
      - name: Модульні тести симулятора (розбір, DTP, EtherChannel, STP, ACL)
        run: node tests/cli-unit.js
      - name: Фазинг симулятора
        run: node tests/fuzz.js
      - name: Браузерні тести (smoke і сховище)
        run: |
          npm install --prefix tests --no-audit --no-fund
          npx --prefix tests playwright install --with-deps chromium
          node tests/smoke.mjs
          node tests/storage.mjs
