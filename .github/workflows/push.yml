name: Push-нагадування

on:
  schedule:
    - cron: "7 * * * *"   # щогодини; скрипт сам перевіряє локальний час кожного пристрою
  workflow_dispatch:
    inputs:
      force:
        description: "Надіслати тестове сповіщення всім зараз (1 — так)"
        default: "0"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund
      - run: node scripts/push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force || '0' }}
