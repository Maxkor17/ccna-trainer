<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA тренажер</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6e8a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1b1f24; --muted:#5d6672; --line:#e3e6ea;
  --accent:#0b6e8a; --accent-soft:#e3f1f5; --ok:#1d7a46; --ok-soft:#e5f4ea; --bad:#b3261e; --bad-soft:#fbe9e7;
  --warn:#8a5a00; --warn-soft:#fff4dc; --code:#f0f2f5; --term:#0f1419; --term-text:#d6e2ea; --grid:#e9ecef;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#111418; --card:#1a1e24; --text:#e7eaee; --muted:#9aa4b0; --line:#2b313a;
    --accent:#4fb3cf; --accent-soft:#16313a; --ok:#5cc98a; --ok-soft:#163323; --bad:#ff8a80; --bad-soft:#3a1d1b;
    --warn:#ffcc66; --warn-soft:#3a2f14; --code:#0f1216; --term:#0a0d10; --term-text:#d6e2ea; --grid:#252b33;
  }
}
:root[data-theme=dark]{
    --bg:#111418; --card:#1a1e24; --text:#e7eaee; --muted:#9aa4b0; --line:#2b313a;
    --accent:#4fb3cf; --accent-soft:#16313a; --ok:#5cc98a; --ok-soft:#163323; --bad:#ff8a80; --bad-soft:#3a1d1b;
    --warn:#ffcc66; --warn-soft:#3a2f14; --code:#0f1216; --term:#0a0d10; --term-text:#d6e2ea; --grid:#252b33;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs,16px)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 12px}
header h1{font-size:18px;margin:0;cursor:pointer}
table.cheat{border-collapse:collapse;width:100%;font-size:.88em;margin:4px 0 10px}table.cheat th,table.cheat td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}table.cheat th{background:var(--accent-soft);color:var(--accent)}ul.cheatl{padding-left:20px;margin:6px 0}ul.cheatl li{margin:5px 0}
.btnlike{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);font:inherit}.btnlike.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.walklist{max-height:220px;overflow:auto;padding-left:22px;margin:6px 0;font-size:.88em}.walklist li{padding:3px 4px;border-radius:6px;cursor:pointer}.walklist li.cur{background:var(--accent-soft);font-weight:600}.walklist li.bad{color:var(--bad)}.walklist li.sep{list-style:none;margin-left:-18px;font-weight:600;color:var(--muted);cursor:default}
.sbl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.sbl select{width:auto;min-width:80px}
.qtext .en{font-weight:400;font-size:.85em;color:var(--accent)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{text-align:left;font-size:.9em}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.ach>div{border:1px solid var(--line);border-radius:10px;padding:8px;opacity:.45;display:flex;flex-direction:column;gap:2px}.ach>div.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}.ach span{font-size:1.4em}.ach small{color:var(--muted);font-size:.78em}
.topo{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:4px}.topo svg{width:100%;height:auto;display:block}
pre.fill{white-space:pre-wrap;line-height:2}pre.fill input{font:inherit;padding:1px 4px;border:1px solid var(--accent);border-radius:4px;background:var(--card);color:var(--text);margin:0 1px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
button.seg{padding:7px 12px;font-size:14px}
button.seg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button.mini{padding:5px 10px;font-size:13px;border-radius:8px}
.topic{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.topic input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.topic .name{flex:1;min-width:0} .topic .name b{font-weight:600;color:var(--muted);font-size:13px;margin-right:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:70px;flex:none}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.wide{width:100%;height:8px;margin:6px 0}
.bar.wide i{background:var(--accent)}
.grp{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.linkbtn{background:none;border:none;color:var(--accent);padding:4px 0;font-size:14px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px;gap:8px}
.qtext{font-size:17px;font-weight:600;margin:4px 0 10px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:8px 0 12px;white-space:pre}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
.opt .mk{display:inline-block;width:22px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt .ex{display:block;font-size:14px;margin-top:6px;opacity:.9}
.opt.locked{cursor:default}
.verdict{font-weight:700;margin:6px 0} .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;margin:0 0 10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.navbar{display:flex;gap:8px;margin-top:12px} .navbar button{flex:1}
.big{font-size:34px;font-weight:700;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;border-top:none} td.num,th.num{text-align:right}
details{border-top:1px solid var(--line);padding:8px 0} details summary{cursor:pointer}
textarea,input[type=text],input[type=search],select{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--text)}
textarea{min-height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--code)}
.note{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:8px 0}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dots span{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dots span.done{background:var(--accent-soft);border-color:var(--accent)} .dots span.cur{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tok{display:inline-block;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:14px;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace}
.seq{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;margin:6px 0}
.seq .tok{width:100%} .seq .tok .n{color:var(--muted);margin-right:6px}
.mrow{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.mrow .l{font-weight:600}
.cmdin{font:15px ui-monospace,Menlo,Consolas,monospace}
.term{background:var(--term);color:var(--term-text);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;height:360px;overflow:auto;white-space:pre}
.termin{display:flex;align-items:center;gap:6px;background:var(--term);color:var(--term-text);border-radius:10px;padding:6px 10px;margin-top:6px;font:14px ui-monospace,Menlo,Consolas,monospace}
.termin input{flex:1;background:transparent;border:none;color:var(--term-text);font:inherit;outline:none;padding:6px 0}
.checklist{list-style:none;padding:0;margin:6px 0} .checklist li{padding:3px 0}
.flagbtn{background:none;border:none;color:var(--muted);font-size:13px;padding:6px 0}
.flagbtn.on{color:var(--warn);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .b{fill:var(--accent)} .chart .b:hover{opacity:.8}
.tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;z-index:10}
select.full{width:100%}
.course{display:flex;gap:8px;flex-wrap:wrap}.course div{flex:1;min-width:90px;background:var(--code);border-radius:10px;padding:10px;text-align:center}.course b{display:block;font-size:24px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home-link">CCNA тренажер</h1>
    <span id="status" class="chip">☁ Підключення…</span>
  </header>
  <main id="app"></main>
</div>
<div class="tip" id="tip"></div>
<script src="firebase-config.js"></script>

<script src="questions-extra.js"></script>
<script src="questions-srwe2.js"></script>
<script src="questions-ensa.js"></script>
<script src="questions-netacad.js"></script>
<script src="gen.js"></script>
<script src="gen2.js"></script>
<script src="gen3.js"></script>

<script>
"use strict";
// ================= Дані =================
const TOPICS = [
 ["ITN1","ITN","1","Мережі сьогодні"],["ITN2","ITN","2","Базова конфігурація комутатора й кінцевих пристроїв"],
 ["ITN3","ITN","3","Протоколи та моделі"],["ITN4","ITN","4","Фізичний рівень"],["ITN5","ITN","5","Системи числення"],
 ["ITN6","ITN","6","Канальний рівень"],["ITN7","ITN","7","Комутація Ethernet"],["ITN8","ITN","8","Мережевий рівень"],
 ["ITN9","ITN","9","Розв'язання адрес"],["ITN10","ITN","10","Базова конфігурація маршрутизатора"],["ITN11","ITN","11","IPv4-адресація"],
 ["ITN12","ITN","12","IPv6-адресація"],["ITN13","ITN","13","ICMP"],["ITN14","ITN","14","Транспортний рівень"],
 ["ITN15","ITN","15","Прикладний рівень"],["ITN16","ITN","16","Основи мережевої безпеки"],["ITN17","ITN","17","Побудова невеликої мережі"],
 ["SRWE1","SRWE","1","Базове налаштування пристроїв"],["SRWE2","SRWE","2","Принципи комутації"],["SRWE3","SRWE","3","VLAN"],
 ["SRWE4","SRWE","4","Маршрутизація між VLAN"],["SRWE5","SRWE","5","Принципи роботи STP"],["SRWE6","SRWE","6","EtherChannel"],
 ["SRWE7","SRWE","7","DHCPv4"],["SRWE8","SRWE","8","SLAAC і DHCPv6"],["SRWE9","SRWE","9","FHRP"],["SRWE10","SRWE","10","Принципи безпеки LAN"],
 ["SRWE11","SRWE","11","Налаштування безпеки комутатора"],["SRWE12","SRWE","12","Принципи WLAN"],["SRWE13","SRWE","13","Налаштування WLAN"],
 ["SRWE14","SRWE","14","Принципи маршрутизації"],["SRWE15","SRWE","15","Статична маршрутизація"],["SRWE16","SRWE","16","Діагностика статичних маршрутів"],
 ["ENSA1","ENSA","1","Принципи OSPFv2"],["ENSA2","ENSA","2","Налаштування OSPFv2"],["ENSA3","ENSA","3","Принципи мережевої безпеки"],
 ["ENSA4","ENSA","4","Принципи ACL"],["ENSA5","ENSA","5","Налаштування ACL"],["ENSA6","ENSA","6","NAT для IPv4"],["ENSA7","ENSA","7","Принципи WAN"],
 ["ENSA8","ENSA","8","VPN і IPsec"],["ENSA9","ENSA","9","QoS"],["ENSA10","ENSA","10","Керування мережею"],["ENSA11","ENSA","11","Проєктування мережі"],
 ["ENSA12","ENSA","12","Діагностика мережі"],["ENSA13","ENSA","13","Віртуалізація мережі"],["ENSA14","ENSA","14","Автоматизація мережі"]
].map(([id,g,n,name])=>({id,g,n,name}));
const TMAP = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const QB_BASE = [...(window.QB_ITN||[]), ...(window.QB_SRWE||[]), ...(window.QB_NOTES||[]), ...(window.QB_EXTRA||[]), ...(window.QB_SRWE2||[]), ...(window.QB_ENSA||[]), ...(window.QB_NETACAD||[]), ...(window.QB_FIGS||[]), ...(window.QB_EN||[])];
let customQs = [];
let QB = QB_BASE.slice();
let QMAP = Object.fromEntries(QB.map(q=>[q.id,q]));
function rebuildQB(){ QB = QB_BASE.concat(customQs.filter(q=>TMAP[q.t])); QMAP = Object.fromEntries(QB.map(q=>[q.id,q])); }
const COURSES=[["ITN","Вступ до мереж"],["SRWE","Комутація, маршрутизація, бездротові мережі"],["ENSA","Корпоративні мережі, безпека, автоматизація"]];
const GEN = window.GEN, CLI = window.CLI;
const TID2GEN = {"g-showstp":"g-showstp","g-showtrunk":"g-showtrunk","g-showec":"g-showec","g-showint":"g-showint","g-lpm":"g-lpm","g-ad":"g-ad","g-wild":"g-wild","g-ospfcost":"g-ospfcost","g-rid":"g-rid","g-bin":"g-bin","g-hex":"g-bin","g-net":"g-subnet","g-bc":"g-subnet","g-range":"g-subnet","g-hosts":"g-subnet","g-vlsm":"g-vlsm","g-ipv6":"g-ipv6","g-eui":"g-eui","g-stproot":"g-stproot","g-stprp":"g-stprp","g-stpcost":"g-stpcost","g-stpprio":"g-stpprio"};
const INT_DAYS = [0,1,3,7,16,35], DAY = 864e5;
const LS = {sandbox:"ccna.sandbox.v1",snaps:"ccna.snaps.v1",custom:"ccna.custom.v1",prog:"ccna.prog.v1",exams:"ccna.exams.v1",sel:"ccna.sel.v1",opts:"ccna.opts.v1",daily:"ccna.daily.v1",flags:"ccna.flags.v1",labs:"ccna.labs.v1"};
const TYPE_NAME = {mc:"", order:"Розставте по порядку", match:"Зіставте", cmd:"Введіть команду", fill:"Заповніть пропуски", flash:"Картка"};

// Концепції для аналітики (за темою + ключовими словами)
const CONCEPTS = {
 SRWE1:[["Завантаження й відновлення",/boot|POST|ROMMON|register|0x21|flash_init|BOOT|кнопк.*Mode|відновлен|завантаж/i],["LED-індикатори",/індикатор|LED|SYST|RPS|SPEED/i],["SSH і віддалений доступ",/SSH|RSA|vty|domain|K9|transport|Telnet/i],["Лічильники й стан інтерфейсів",/runts|giants|CRC|collision|ignored|overrun|line protocol|administratively|duplex|MDIX|лічильник/i],["SVI і керування",/SVI|default-gateway|керуван/i],["CLI, історія, show",/історі|Ctrl|history|show version|NVRAM|копі|збереж/i]],
 SRWE2:[["Методи комутації",/store|cut-through|fast-forward|fragment|FCS|затримк|швидкост/i],["MAC-таблиця",/MAC-табл|mac address-table|навча|старін|запис|Source MAC|переїха|переключ/i],["Домени колізій і broadcast",/домен|хаб|broadcast|мікросегмент|multicast/i],["Буферизація й ASIC",/буфер|ASIC/i]],
 SRWE3:[["DTP",/DTP|dynamic|nonegotiate/i],["Native VLAN і VLAN hopping",/native|hopping|double/i],["Voice VLAN і QoS",/голос|voice|CoS|телефон|qos/i],["VTP",/VTP/i],["Діапазони та збереження VLAN",/vlan\.dat|діапазон|1006|1005|зберіга|перезаванта|no vlan|VLAN 1\b/i],["802.1Q-тег",/802\.1Q|TPID|VLAN ID|тег/i],["Trunk: allowed і перевірка",/allowed|trunk/i],["Призначення портів",/access|порт/i]],
 SRWE4:[["Router-on-a-stick",/субінтерфейс|router-on-a-stick|dot1Q|G0\/0\.|ROAS/i],["L3-комутатор і SVI",/SVI|L3|ip routing|routed|no switchport|interface vlan/i],["Legacy inter-VLAN",/legacy/i],["Діагностика шлюзу й портів",/шлюз|gateway|ipconfig|не пінгує/i]],
 SRWE5:[["PortFast і BPDU Guard",/portfast|bpdu/i],["Вибір root bridge",/root bridge|BID|пріоритет|priority|root primary/i],["Root port і вартість",/root port|вартіст|cost/i],["Ролі портів",/роль|alternate|backup|designated|Altn/i],["Стани й таймери",/стан|listening|learning|blocking|forward delay|таймер|discarding/i],["Петлі й шторми",/петл|шторм|storm|TTL|дублю|лягла/i],["Версії STP",/PVST|MST|RSTP|rapid/i]],
 SRWE6:[["Режими PAgP/LACP",/PAgP|LACP|active|passive|desirable|\bauto\b|mode on|\bon\b/i],["Вимоги до портів",/збіга|швидк|suspended|\(s\)|різн|FastEthernet/i],["Балансування",/баланс|load-balance|хеш|потік/i],["Налаштування й перевірка",/channel-group|summary|port-channel|show|BW/i]]
};
function textOf(q){ return [q.q, ...(q.o||[]).map(o=>o[0]), ...(q.items||[]), ...((q.pairs||[]).flat()), ...(Array.isArray(q.ans)?q.ans:[q.ans||""]), q.cfg||""].join(" "); }
function conceptOf(id){
  const q=QMAP[id]; if(!q){ return GEN.conceptOf[id]||"Розрахунки"; }
  if(q.k) return q.k;
  const rules=CONCEPTS[q.t]; if(rules){ const s=q.q; for(const [n,re] of rules) if(re.test(s)) return n; const all=textOf(q); for(const [n,re] of rules) if(re.test(all)) return n; }
  return TMAP[q.t].name;
}
function topicOfId(id){ return QMAP[id]? QMAP[id].t : (GEN.topicOf[id]||null); }

// ================= Утиліти =================
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

async function loadFirebase(){

  let db; try{ db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})}); }catch(e){ db=fsM.getFirestore(app); }
  return {authM,fsM,auth,db};

const plain=o=>JSON.parse(JSON.stringify(o)); // Firestore не приймає undefined
function makeDb(F,uid){
  const {fsM,db}=F;
  const wrapDoc=r=>({
    get:async()=>{ const s=await fsM.getDoc(r); return {exists:s.exists(),data:()=>s.data()}; },
    set:d=>fsM.setDoc(r,plain(d)),
    update:d=>fsM.setDoc(r,plain(d),{merge:true}),
    delete:()=>fsM.deleteDoc(r),
    onSnapshot:(n,e)=>fsM.onSnapshot(r,s=>n({exists:s.exists(),data:()=>s.data(),metadata:s.metadata}),e)
  });
  return {
    doc:p=>wrapDoc(fsM.doc(db,"users",uid,...p.split("/"))),
    collection:p=>{ const c=fsM.collection(db,"users",uid,...p.split("/"));
      return {add:d=>fsM.addDoc(c,plain(d)), orderBy:(f,dir)=>({limit:n=>({get:async()=>{ const s=await fsM.getDocs(fsM.query(c,fsM.orderBy(f,dir),fsM.limit(n))); return {docs:s.docs.map(d=>({data:()=>d.data()}))}; }})})}; }
  };
}
async function initStore(){

    if(store.unsub){ try{store.unsub();}catch(e){} store.unsub=null; }

}
async function connectDb(db){
  try{
    store.db=db; store.ref=db.doc("progress/state");
    const snap = await Promise.race([store.ref.get(), sleep(15000).then(()=>{throw new Error("timeout");})]);
    if(snap.exists){ const d=snap.data()||{};
      prog=mergeByTs(prog,d.q||{},"l"); daily=mergeDaily(daily,d.daily||{}); flags=mergeByTs(flags,d.flags||{},"ts"); labs=mergeByTs(labs,d.labs||{},"ts");

    } else await store.ref.set({q:prog,daily,flags,labs,created:Date.now(),updated:Date.now()});
    cacheAll();
    try{ const es=await db.collection("exams").orderBy("ts","desc").limit(100).get(); const remote=es.docs.map(d=>d.data()); const have=new Set(remote.map(e=>e.ts));
      for(const e of exams){ if(!have.has(e.ts)){ try{await db.collection("exams").add(e);}catch(_){} remote.push(e);} }
      exams=remote.sort((a,b)=>b.ts-a.ts); lsSet(LS.exams,exams); }catch(e){}
    try{ const cs=await db.collection("custom").orderBy("ts","desc").limit(1000).get(); const remote=cs.docs.map(d=>d.data()).filter(q=>q&&q.id); const ids=new Set(remote.map(q=>q.id));

      customQs=remote; lsSet(LS.custom,customQs); rebuildQB(); }catch(e){}
    store.mode="db"; setStatus(); setTimeout(autoBackup,3000);
    store.db.doc("sandbox/main").get().then(d=>{ if(!d.exists) return; const x=d.data(); const loc=lsGet(LS.sandbox,null); if(x&&x.json&&(!loc||!loc.ts||x.ts>loc.ts)) lsSet(LS.sandbox,JSON.parse(x.json)); }).catch(()=>{});
    store.unsub=store.ref.onSnapshot(s=>{ if(!s.exists) return; const d=s.data()||{}; prog=clone(d.q||{}); daily=clone(d.daily||{}); flags=clone(d.flags||{}); labs=clone(d.labs||{}); cacheAll(); rerenderPassive(); },()=>{});

  const r = prog[id] ? Object.assign({},prog[id]) : {s:0,c:0,w:0,b:0,d:0,l:0,k:0};
  r.s++; r.l=now;
  if(ok){ r.c++; r.b=Math.min(r.b+1,5); r.d=now+INT_DAYS[r.b]*DAY; r.k=1; } else { r.w++; r.b=0; r.d=now; r.k=0; }

  patch({q:{[id]:r}, daily:{[dk]:dd}});
}

function reviewQueue(){

  for(const [id,r] of Object.entries(prog)){ if(!(r.w>0 && r.b<5 && r.d<=now)) continue;
    if(QMAP[id]) out.push(QMAP[id]); else if(TID2GEN[id]||GEN.list[id]){ const g=GEN.make(TID2GEN[id]||id); if(g) out.push(g); } }

function topicStats(tid){
  const qs=QB.filter(q=>q.t===tid); let c=0,w=0,seen=0,mast=0;
  for(const q of qs){const r=prog[q.id]; if(r){seen++;c+=r.c;w+=r.w; if(r.b>=3) mast++;}}
  for(const [g,t] of Object.entries(GEN.topicOf)) if(t===tid && prog[g]){ c+=prog[g].c; w+=prog[g].w; }
  return {n:qs.length, seen, acc:(c+w)? c/(c+w): null, mast, gen:Object.values(GEN.topicOf).includes(tid)};
}
function pickTraining(topics, n){
  const now=Date.now(); const b=[[],[],[],[]];
  for(const q of qsFor(topics)){ const r=prog[q.id];
    if(!r) b[1].push(q); else if(r.k===0 && r.d<=now) b[0].push(q); else if(r.d<=now) b[2].push(q); else b[3].push(q); }
  let all=[].concat(...b.map(shuffle));
  const gk=genKeysFor(topics);
  const want = n>0? n : all.length;
  const ng = gk.length? Math.max(1, Math.round(want*0.2)) : 0;
  all = all.slice(0, want-ng);
  for(let i=0;i<ng;i++){ const g=GEN.make(gk[i%gk.length]); if(g) all.splice(Math.floor(Math.random()*(all.length+1)),0,g); }
  return all;
}
const correctSet=q=>new Set(q.a);
function isCorrect(q, ans){
  const t=qtype(q);
  if(t==="mc"){ const ch=ans||[]; const cs=correctSet(q); return ch.length===cs.size && ch.every(i=>cs.has(i)); }
  if(t==="order") return Array.isArray(ans) && ans.length===q.items.length && ans.every((v,i)=>v===i);
  if(t==="match") return Array.isArray(ans) && q.pairs.every((p,i)=>ans[i]===p[1]);
  if(t==="cmd") return typeof ans==="string" && q.ans.some(c=>cmdMatch(ans,c));
  if(t==="flash") return ans==="yes";
  if(t==="fill"){ const bl=fillBlanks(q); return Array.isArray(ans) && bl.every((alts,i)=>typeof ans[i]==="string"&&alts.some(c=>fillEq(ans[i],c))); }
  return false;
}
function fillBlanks(q){ return [...q.cfg.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1].split("|")); }
function fillEq(u,c){ u=(u||"").trim(); if(!u) return false; if(/^[\d.\/]+$/.test(c)) return u===c; return u.toLowerCase()===c.toLowerCase() || cmdMatch(u,c); }
function hasAnswer(q,ans){ const t=qtype(q); if(t==="flash") return ans==="yes"||ans==="no"; if(t==="fill") return Array.isArray(ans)&&fillBlanks(q).every((_,i)=>ans[i]&&ans[i].trim()); if(t==="cmd") return !!(ans&&ans.trim()); if(t==="match") return Array.isArray(ans)&&ans.filter(Boolean).length===q.pairs.length; if(t==="order") return Array.isArray(ans)&&ans.length===q.items.length; return Array.isArray(ans)&&ans.length===q.a.length; }
function cmdMatch(input, canon){
  const norm=s=>s.trim().toLowerCase().replace(/\s*,\s*/g,",").replace(/\s+-\s+/g," - ");
  let u=norm(input).split(/\s+/), c=norm(canon).split(/\s+/);
  const join=arr=>{ const o=[]; for(let i=0;i<arr.length;i++){ if(/^[a-z-]+$/.test(arr[i]) && arr[i+1] && /^\d+(\/\d+)*$/.test(arr[i+1]) && CLI.normIf(arr[i]+arr[i+1]) && o.length && "interfaces".startsWith(o[o.length-1])){ o.push(arr[i]+arr[i+1]); i++; } else o.push(arr[i]); } return o; };
  u=join(u); c=join(c);
  if(u.length!==c.length) return false;
  return c.every((ct,i)=>{ const ut=u[i];
    if(/\d/.test(ct)){ const a=CLI.normIf(ut), b=CLI.normIf(ct); if(a&&b) return a===b; return ut===ct; }
    return ut===ct || (ut.length>=2 && ct.startsWith(ut)); });
}

// ================= Сесії =================
function startSession(mode, list, title){
  if(!list.length) return;
  S={mode, title, items:list, i:0, ans:{}, checked:{}, order:{}, start:Date.now(), deadline: mode==="exam"? Date.now()+list.length*60*1000 : null, confirmEnd:false};
  list.forEach((q,k)=>{ const t=qtype(q);
    if(t==="mc") S.order[k]=opts.shuffle? shuffle(q.o.map((_,i)=>i)) : q.o.map((_,i)=>i);
    if(t==="order"){ let o=shuffle(q.items.map((_,i)=>i)); if(o.every((v,i)=>v===i)) o.reverse(); S.order[k]=o; }
    if(t==="match") S.order[k]=q.choices? q.choices.slice() : shuffle([...new Set(q.pairs.map(p=>p[1]))]);
  });
  view="quiz"; render(); scrollTop(); if(mode==="exam") tick();
}
function tick(){ if(!S||S.mode!=="exam"||view!=="quiz") return; const left=S.deadline-Date.now(); const el=$("#timer"); if(el) el.textContent=fmtLeft(left); if(left<=0){finishExam();return;} setTimeout(tick,1000); }
function fmtLeft(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+":"+String(s).padStart(2,"0");}
function scrollTop(){try{window.scrollTo(0,0);}catch(e){}}
function finishExam(){
  if(!S) return; const per={}; let ok=0;
  S.items.forEach((q,k)=>{ const a=S.ans[k]; const good=isCorrect(q,a); if(good) ok++; per[q.t]=per[q.t]||[0,0]; per[q.t][1]++; if(good) per[q.t][0]++; if(hasAnswer(q,a)) record(recId(q),good); });
  const e={ts:Date.now(), n:S.items.length, correct:ok, pct:Math.round(ok/S.items.length*100), dur:Math.round((Date.now()-S.start)/1000), per, ccna:!!S.ccna,
    ids:S.items.map(q=>q.gen?null:q.id), ans:Object.fromEntries(Object.entries(S.ans).filter(([k])=>!S.items[k].gen).map(([k,v])=>[S.items[k].id,v]))};
  saveExam(e); S.result=e; view="result"; render(); scrollTop();
}

// Схема топології: nodes [{id,t:"r"|"sw"|"pc"|"srv"|"cloud",x,y,l}], links [{a,b,la,lb,m,dash}] у координатах 0..100 × 0..60
function topoSVG(f){
  const W=400,H=Math.round(240*(f.h||60)/60), X=x=>20+x*3.6, Y=y=>18+y*3.4;
  const N={}; for(const n of f.nodes) N[n.id]=n;
  let g="";
  for(const l of f.links){ const a=N[l.a], b=N[l.b]; const x1=X(a.x),y1=Y(a.y),x2=X(b.x),y2=Y(b.y);
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(${l.c||"--muted"})" stroke-width="${l.w||2}" ${l.dash?'stroke-dasharray="5 4"':""}/>`;
    const lab=(t,fx,fy)=>t?`<text x="${fx}" y="${fy}" font-size="10" text-anchor="middle" fill="var(--text)" paint-order="stroke" stroke="var(--card)" stroke-width="3">${esc(t)}</text>`:"";
    g+=lab(l.la,x1+(x2-x1)*0.24,y1+(y2-y1)*0.24-4)+lab(l.lb,x2+(x1-x2)*0.24,y2+(y1-y2)*0.24-4)+lab(l.m,(x1+x2)/2,(y1+y2)/2+(l.mdy||12));
  }
  for(const n of f.nodes){ const x=X(n.x), y=Y(n.y); let ic=n.hl?`<circle cx="${x}" cy="${y}" r="25" fill="var(--warn)" opacity=".28"><animate attributeName="r" values="21;27;21" dur="1.2s" repeatCount="indefinite"/></circle>`:"";
    if(n.t==="r") ic+=`<circle cx="${x}" cy="${y}" r="15" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><path d="M${x-8} ${y}h16M${x} ${y-8}v16" stroke="var(--accent)" stroke-width="2"/>`;

function renderQuiz(){
  const k=S.i, q=S.items[k], ans=S.ans[k];

  const modeName=S.title||{train:"Тренування",review:"Повтор помилок",exam:"Екзамен",gen:"Розрахунки",module:"Тест модуля"}[S.mode];
  const badge=(q.src==="my"?` <span class="chip" style="font-size:11px;padding:1px 7px">✍ моє</span>`:"")+(q.src==="na"?` <span class="chip" style="font-size:11px;padding:1px 7px">🎓 NetAcad</span>`:"")+(q.src==="n"?` <span class="chip" style="font-size:11px;padding:1px 7px">📒 з нотаток</span>`:"")+(q.gen?` <span class="chip" style="font-size:11px;padding:1px 7px">🎲 генератор</span>`:"")+(TYPE_NAME[qtype(q)]?` <span class="chip" style="font-size:11px;padding:1px 7px">${TYPE_NAME[qtype(q)]}</span>`:"");
  let verdict=""; if(checked){ const ok=isCorrect(q,ans); verdict=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Правильно!":"Неправильно"}</div>`; }
  let nav="";
  if(S.mode==="exam"){
    const done=S.items.filter((qq,i)=>hasAnswer(qq,S.ans[i])).length;
    nav= S.ccna? `<div class="navbar">${S.i<S.items.length-1?`<button class="primary" data-act="next">Далі → (повернутися не можна)</button>`:`<button class="primary" data-act="end2">Завершити іспит</button>`}</div><div class="small muted">Відповіді: ${done}/${S.items.length}. Як на справжньому CCNA, до попередніх питань повернутися не можна.</div>`
      : `<div class="navbar"><button data-act="prev" ${S.i?"":"disabled"}>← Назад</button>${S.i<S.items.length-1?`<button class="primary" data-act="next">Далі →</button>`:""}</div>
      <div class="navbar"><button class="${S.confirmEnd?"primary":""}" data-act="end">${S.confirmEnd?`Точно завершити? Відповіді: ${done}/${S.items.length}`:"Завершити екзамен"}</button></div>

  } else {
    nav = checked ? `<div class="navbar"><button class="primary" data-act="next">${S.i<S.items.length-1?"Далі →":"Завершити"}</button></div>${flagBtn(q)}`

  }
  return `<div class="card">
    <div class="qmeta"><span>${modeName} · ${S.i+1}/${S.items.length}</span>${S.mode==="exam"?`<span>⏱ <span id="timer">${fmtLeft(S.deadline-Date.now())}</span></span>`:`<span>${tlabel(q.t)}</span>`}</div>
    <div class="progress"><i style="width:${Math.round(S.i/S.items.length*100)}%"></i></div>
    <div class="small muted">${S.mode==="exam"?tlabel(q.t)+" · ":""}${esc(TMAP[q.t].name)}${badge}</div>
    <div class="qtext">${opts.enTerms&&q.src!=="en"?annotate(esc(q.q)):esc(q.q)}</div>${q.fig?topoSVG(q.fig):""}${q.c?`<pre>${esc(q.c)}</pre>`:""}

}

const DOMAINS=[["Основи мереж",0.20,["ITN1","ITN3","ITN4","ITN5","ITN6","ITN7","ITN8","ITN9","ITN11","ITN12","ITN13","ITN14","SRWE2","ENSA7","ENSA11","ENSA12"]],
 ["Доступ до мережі",0.20,["ITN2","ITN10","SRWE1","SRWE3","SRWE5","SRWE6","SRWE12","SRWE13"]],
 ["IP-зв'язність",0.25,["SRWE4","SRWE9","SRWE14","SRWE15","SRWE16","ENSA1","ENSA2"]],
 ["IP-сервіси",0.10,["ITN15","SRWE7","SRWE8","ENSA6","ENSA9","ENSA10"]],
 ["Основи безпеки",0.15,["ITN16","ITN17","SRWE10","SRWE11","ENSA3","ENSA4","ENSA5","ENSA8"]],
 ["Автоматизація",0.10,["ENSA13","ENSA14"]]];
const domainOf=t=>{ const d=DOMAINS.find(x=>x[2].includes(t)); return d?d[0]:"Інше"; };
function pickCcna(n){
  const out=[]; const used=new Set();
  for(const [name,w,ts] of DOMAINS){ const want=Math.round(n*w); const set=new Set(ts);
    const gk=GEN.forTopics(set); const ng=gk.length?Math.round(want*0.15):0;
    const qs=shuffle(QB.filter(q=>set.has(q.t)&&!used.has(q.id)&&qtype(q)!=="flash")).slice(0,want-ng); qs.forEach(q=>used.add(q.id)); out.push(...qs);
    for(let i=0;i<ng;i++){ const g=GEN.make(gk[i%gk.length]); if(g) out.push(g); } }
  return shuffle(out).slice(0,n);
}
// ---- План до дати екзамену ----
function planInfo(){
  if(!opts.examDate) return null; const days=Math.ceil((new Date(opts.examDate+"T09:00:00")-Date.now())/864e5);
  const all=TOPICS.map(t=>Object.assign({id:t.id},topicReady(t.id)||{p:0,n:0,seen:0})).filter(x=>x.n);
  const avg=all.reduce((a,x)=>a+x.p*x.n,0)/Math.max(1,all.reduce((a,x)=>a+x.n,0));
  const unseen=all.reduce((a,x)=>a+(x.n-x.seen),0); const due=Object.values(prog).filter(r=>r.d&&r.d<=Date.now()).length;
  const perDay=days>0? Math.ceil(unseen/Math.max(1,days-3))+Math.min(due,40) : due;
  const weak=all.filter(x=>x.seen>0||x.p<0.5).sort((a,b)=>a.p-b.p).slice(0,3);
  return {days,avg,unseen,due,perDay,weak};
}
function startPlan(){ const pi=planInfo(); if(!pi) return; const set=new Set(pi.weak.map(w=>w.id)); for(const [id,r] of Object.entries(prog)) if(r.d&&r.d<=Date.now()&&QMAP[id]) set.add(QMAP[id].t);
  startSession("train", pickTraining(set, Math.max(opts.goal, Math.min(60,pi.perDay))), "План на сьогодні"); }
function pickModule(tid){
  const now=Date.now(); const qs=QB.filter(q=>q.t===tid);
  const na=shuffle(qs.filter(q=>q.src==="na"));
  const weak=shuffle(qs.filter(q=>q.src!=="na"&&prog[q.id]&&prog[q.id].k===0));
  const fresh=shuffle(qs.filter(q=>q.src!=="na"&&!prog[q.id]));
  const rest=shuffle(qs.filter(q=>q.src!=="na"&&prog[q.id]&&prog[q.id].k!==0)).sort((a,b)=>(prog[a.id].b||0)-(prog[b.id].b||0));
  const gk=Object.entries(GEN.list).filter(([k,g])=>g.t===tid).map(([k])=>k);
  const ng=gk.length?Math.min(4,Math.max(2,20-qs.length)):0;
  let list=[...na,...weak,...fresh,...rest].slice(0,20-ng);
  for(let i=0;i<ng;i++){ const g=GEN.make(gk[i%gk.length]); if(g) list.push(g); }
  return shuffle(list);

// ================= Прогноз готовності =================
// Оцінка ймовірності правильної відповіді: точність питання × «пам'ять» (згасає з часом, повільніше для засвоєних).
function pKnow(id){
  const r=prog[id]; if(!r) return 0.25;
  const acc=(r.c+1)/(r.c+r.w+2);
  const stability=DAY*(1+[1,2,5,12,25,50][Math.min(5,r.b||0)]);
  const ret=Math.exp(-(Date.now()-(r.l||0))/stability);
  return 0.25+0.75*acc*(r.k?Math.max(ret,0.35):ret*0.6);
}
function topicReady(tid){
  const ids=QB.filter(q=>q.t===tid).map(q=>q.id).concat(Object.keys(GEN.topicOf).filter(g=>GEN.topicOf[g]===tid));
  if(!ids.length) return null;
  const seen=ids.filter(i=>prog[i]).length;
  return {p:ids.reduce((s,i)=>s+pKnow(i),0)/ids.length, n:ids.length, seen};
}
function courseReady(g){
  const ts=TOPICS.filter(t=>t.g===g).map(t=>Object.assign({t},topicReady(t.id)||{p:0,n:0,seen:0}));
  const n=ts.reduce((s,x)=>s+x.n,0); return {p:n?ts.reduce((s,x)=>s+x.p*x.n,0)/n:0, seen:ts.reduce((s,x)=>s+x.seen,0), n, topics:ts};
}

    ${weak.length?`<p class="small muted" style="margin:8px 0 0">Найслабше: ${weak.map(x=>tlabel(x.t.id)+" "+esc(x.t.name)+" ("+Math.round(x.r.p*100)+"%)").join(", ")}</p>`:""}</div>`;
}

// ---- Імпорт карток з Obsidian (.md) ----
const KW=[[/vlan|trunk|dtp|802\.1q/i,"SRWE3"],[/inter-?vlan|router-on-a-stick|roas|svi/i,"SRWE4"],[/\bstp\b|spanning|rstp|bpdu|portfast/i,"SRWE5"],[/etherchannel|lacp|pagp/i,"SRWE6"],[/dhcpv6|slaac/i,"SRWE8"],[/dhcp/i,"SRWE7"],[/hsrp|vrrp|glbp|fhrp/i,"SRWE9"],[/port.?security|snooping|\bdai\b/i,"SRWE11"],[/wlan|wi-?fi|802\.11|capwap|wlc/i,"SRWE12"],[/static rout|статичн/i,"SRWE15"],[/ospf/i,"ENSA2"],[/\bacl|access-list|wildcard/i,"ENSA5"],[/\bnat\b|\bpat\b/i,"ENSA6"],[/vpn|ipsec|gre/i,"ENSA8"],[/qos|dscp/i,"ENSA9"],[/snmp|syslog|ntp|cdp|lldp/i,"ENSA10"],[/rest|json|yaml|ansible|sdn/i,"ENSA14"],[/ipv6/i,"ITN12"],[/subnet|підмереж|vlsm|ipv4/i,"ITN11"],[/tcp|udp|порт/i,"ITN14"],[/osi|tcp\/ip|інкапсул/i,"ITN3"],[/ethernet|mac/i,"ITN7"],[/arp/i,"ITN9"]];
function guessTopic(name,text,def){ const m=(name||"").match(/\b(ITN|SRWE|ENSA)\s*[-_ ]?\s*(\d{1,2})\b/i); if(m&&TMAP[m[1].toUpperCase()+Number(m[2])]) return m[1].toUpperCase()+Number(m[2]);
  for(const [re,t] of KW) if(re.test(name)) return t; for(const [re,t] of KW) if(re.test(text)) return t; return def; }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function parseMd(name,txt,def){
  const out=[]; txt=txt.replace(/\r/g,"").replace(/^---\n[\s\S]*?\n---\n/,""); const lines=txt.split("\n"); const clean=x=>x.replace(/<!--SR:.*?-->/g,"").replace(/\[\[([^\]|]+\|)?([^\]]+)\]\]/g,"$2").trim();
  const push=(q,a)=>{ q=clean(q); a=clean(a); if(q.length<3||!a) return; out.push({id:"ob-"+hashStr(name+"|"+q),type:"flash",t:guessTopic(name,q+" "+a,def),q,ans:a,src:"n",file:name,ts:Date.now()}); };
  for(let i=0;i<lines.length;i++){ const l=lines[i];
    let m=l.match(/^(?:[-*]\s*)?(.+?)\s*:::\s*(.+)$/); if(m){ push(m[1],m[2]); continue; }
    m=l.match(/^(?:[-*]\s*)?(.+?)\s*::\s*(.+)$/); if(m&&!/^https?$/i.test(m[1])){ push(m[1],m[2]); continue; }
    m=l.match(/^(?:\*\*)?(?:Q|П|Питання)\s*[:.]\s*(?:\*\*)?\s*(.+)$/i); if(m&&lines[i+1]!==undefined){ const n=lines[i+1].match(/^(?:\*\*)?(?:A|В|Відповідь)\s*[:.]\s*(?:\*\*)?\s*(.+)$/i); if(n){ push(m[1],n[1]); i++; continue; } }
    if(/^\?{1,2}\s*$/.test(l)){ let a=i-1, qs=[]; while(a>=0&&lines[a].trim()&&!/^#/.test(lines[a])){ qs.unshift(lines[a]); a--; } let b=i+1, as=[]; while(b<lines.length&&lines[b].trim()&&!/^\?{1,2}\s*$/.test(lines[b])&&!/^#/.test(lines[b])){ as.push(lines[b]); b++; } if(qs.length&&as.length) push(qs.join("\n"),as.join("\n")); i=b-1; }
  }
  return out; }
async function importMd(files){

      customQs.push(q); n++; if(store.mode==="db") queueWrite(()=>store.db.doc("custom/"+q.id).set(q)); } }
  lsSet(LS.custom,customQs); rebuildQB(); opts.obLast=Date.now(); lsSet(LS.opts,opts);

function weakConcepts(){

function chartSVG(){

  const iw=(W-pl-pr)/days.length, bw=Math.max(6,iw-4); const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g=""; for(let v=0;v<=top;v+=step){ g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }

  days.forEach((x,i)=>{ const cx=pl+i*iw+(iw-bw)/2; const h=(H-pt-pb)*(x.n/top);
    if(x.n){ const r=Math.min(4,h/2); const yy=y(x.n), yb=y(0); g+=`<path class="b" data-tip="${x.lab}: ${x.n} відповідей, точність ${Math.round(x.c/x.n*100)}%" d="M${cx},${yb} V${yy+r} Q${cx},${yy} ${cx+r},${yy} H${cx+bw-r} Q${cx+bw},${yy} ${cx+bw},${yy+r} V${yb} Z"/>`; }
    g+=`<rect x="${pl+i*iw}" y="${pt}" width="${iw}" height="${H-pt-pb}" fill="transparent" data-tip="${x.lab}: ${x.n} відповідей${x.n?", точність "+Math.round(x.c/x.n*100)+"%":""}"/>`;

}

async function autoBackup(){
  try{
    if(!Object.keys(prog).length) return;

    if(!snaps.length || Date.now()-snaps[0].ts>=WEEK){ snaps.unshift({ts:Date.now(),n:Object.keys(prog).length,json:exportJSON()}); lsSet(LS.snaps,snaps.slice(0,4)); }
    if(store.mode==="db"&&store.db){
      const meta=store.db.doc("backups/meta"); const m=await meta.get(); const md=m.exists?(m.data()||{}):{};
      if(!md.last || Date.now()-md.last>=WEEK){ const slot=((md.slot||0)+1)%SNAP_KEEP;
        await store.db.doc("backups/s"+slot).set({ts:Date.now(),n:Object.keys(prog).length,json:exportJSON()});
        await meta.set({last:Date.now(),slot}); remoteSnaps=null; }

async function loadRemoteSnaps(){

  const A=API, done=A.st.done, n=APILAB.TASKS.filter(t=>done[t.id]).length;
  const r=A.res; const col=r? (r.code<300?"--ok":r.code<500?"--bad":"--warn") : "--muted";
  return `<div class="card"><h2>🤖 Автоматизація: REST API контролера</h2><p class="small muted" style="margin:0 0 6px">Навчальний контролер на кшталт Cisco Catalyst Center. Виконуйте завдання HTTP-запитами: метод, URL, заголовки, тіло JSON. Виконано ${n}/${APILAB.TASKS.length}.</p>
    <ol class="checklist" style="padding-left:20px">${APILAB.TASKS.map(t=>`<li>${done[t.id]?"✅":"⬜"} ${esc(t.t)}${t.h&&!done[t.id]?`<div class="small muted">${esc(t.h)}</div>`:""}</li>`).join("")}</ol></div>
  <div class="card"><h2>Запит</h2>
    <div class="row"><select id="apim" style="width:auto">${["GET","POST","PUT","PATCH","DELETE"].map(m=>`<option ${A.req.method===m?"selected":""}>${m}</option>`).join("")}</select><input id="apiu" value="${esc(A.req.url)}" autocomplete="off" autocapitalize="off" spellcheck="false" class="grow"></div>
    <label class="small muted">Заголовки (по одному в рядку)</label><textarea id="apih" rows="3" spellcheck="false" autocapitalize="off">${esc(A.req.headers)}</textarea>
    <label class="small muted">Тіло (JSON)</label><textarea id="apib" rows="3" spellcheck="false" autocapitalize="off">${esc(A.req.body)}</textarea>
    <div class="row" style="margin-top:6px"><button class="primary" data-act="apisend">Надіслати</button>${A.st.token?`<button data-act="apitok">+ X-Auth-Token</button>`:""}<button data-act="apireset" class="ghost">Почати заново</button></div></div>
  ${r?`<div class="card"><h2>Відповідь <span style="color:var(${col})">${r.code} ${esc(r.status||"")}</span></h2><pre>${esc(r.body===null?"(порожнє тіло)":JSON.stringify(r.body,null,2))}</pre><p class="small muted" style="margin:0">${r.code===201?"201 — ресурс створено.":r.code===204?"204 — успішно, тіла немає (типово для DELETE).":r.code===401?"401 — немає або недійсна автентифікація.":r.code===404?"404 — неправильний шлях або ресурс не існує.":r.code===405?"405 — метод не підтримується для цього ресурсу.":r.code===409?"409 — конфлікт: ресурс уже існує.":r.code===415?"415 — сервер не розуміє формат тіла (потрібен Content-Type).":r.code===400?"400 — помилка в запиті (JSON або поля).":""}</p></div>`:""}
  <div class="card"><h2>Відповідь на завдання 4</h2><div class="row"><input id="apians" value="${esc(A.ans)}" placeholder="версія ПЗ" class="grow"><button data-act="apians">Перевірити</button></div></div>
  <button class="ghost" data-act="labs">← До списку лаб</button>`; }
function apiSync(){ API.req={method:$("#apim").value,url:$("#apiu").value,headers:$("#apih").value,body:$("#apib").value}; }
function apiDone(){ const n=APILAB.TASKS.filter(t=>API.st.done[t.id]).length; const prev=labs["api"]||{}; const rec={ok:n===APILAB.TASKS.length||!!prev.ok,tries:(prev.tries||0)+1,ts:Date.now(),n:Math.max(n,prev.n||0)}; labs["api"]=rec; patch({labs:{api:rec}}); }
// ---- Анімований шлях пакета ----
let walkTimer=null;
function walkSteps(){ const f=LAB.N.lastFlow; return f.fwd.concat(f.back&&f.back.length?[{sep:true,text:"↩ Відповідь"}].concat(f.back):[]); }
function renderWalk(){ const f=LAB.N.lastFlow; if(!f) return ""; const st=walkSteps(); const i=Math.min(LAB.walk.i,st.length-1); const cur=st[i]||{};
  const ICON={host:"💻",arp:"❓",l2:"🔗",sw:"🔁",l3:"🔀",route:"🧭",acl:"🛡",nat:"🔄",ok:"✅",fail:"❌"};
  return `<div class="card"><div class="row"><h2 class="grow" style="margin:0">🔍 ${esc(f.from)} → ${esc(f.dst)} ${f.proto==="icmp"?"(ping)":"(TCP "+f.dport+")"}</h2><button class="mini ghost" data-act="walkclose">✕</button></div>
    ${topoSVG(CLI.figOf(LAB.N,cur.dev?[cur.dev]:[],cur.link))}
    <div class="note" style="min-height:3.2em"><b>Крок ${i+1}/${st.length}.</b> ${ICON[cur.k]||""} ${esc(cur.text||"")}</div>
    <div class="row" style="margin:8px 0"><button data-act="walkgo" data-d="first">⏮</button><button data-act="walkgo" data-d="-1">◀</button><button class="primary" data-act="walkplay">${LAB.walk.play?"⏸ Пауза":"▶ Відтворити"}</button><button data-act="walkgo" data-d="1">▶</button></div>
    <ol class="walklist">${st.map((x,k)=>x.sep?`<li class="sep">${esc(x.text)}</li>`:`<li class="${k===i?"cur":""} ${x.k==="fail"?"bad":""}" data-act="walkgo" data-d="at" data-k="${k}">${ICON[x.k]||""} ${esc(x.text)}</li>`).join("")}</ol>
    <p class="small ${f.ok?"":"bad"}" style="margin:6px 0 0">${f.ok?"✅ Обмін успішний":"❌ "+esc(f.why||"")}</p></div>`; }
function walkUpd(){ const w=$("#walk"); if(w) w.innerHTML=renderWalk(); const c=document.querySelector(".walklist .cur"); if(c&&c.scrollIntoView) c.scrollIntoView({block:"nearest"}); }
function walkStop(){ if(walkTimer){ clearInterval(walkTimer); walkTimer=null; } if(LAB&&LAB.walk) LAB.walk.play=false; }
// ---- Пісочниця ----
function sbLoad(){ return lsGet(LS.sandbox,null)||{devs:{},links:[]}; }
function sbSave(){ if(!LAB||!LAB.sc.sb) return; const d=CLI.saveNet(LAB.N,LAB.types); d.ts=Date.now(); lsSet(LS.sandbox,d); if(store.mode==="db") queueWrite(()=>store.db.doc("sandbox/main").set({json:JSON.stringify(d),ts:Date.now()})); }
function openSandbox(data){
  data=data||sbLoad(); const N=CLI.netFromSaved(data); const ses=CLI.sessionsFor(N); const types={}; for(const [n,d] of Object.entries(data.devs||{})) types[n]=d.type;
  const outs={}; for(const d of Object.keys(ses)) outs[d]=(LAB&&LAB.sc.sb&&LAB.outs[d])||(/^(pc|server)$/.test(N.dev[d].type)?"Microsoft Windows\n\n":"\nPress RETURN to get started!\n\n");
  const cur=LAB&&LAB.sc.sb&&ses[LAB.cur]?LAB.cur:Object.keys(ses)[0];
  LAB={sc:{id:"sandbox",title:"🧪 Пісочниця",net:true,sb:true,task:["Додавайте пристрої й з'єднуйте порти, далі налаштовуйте їх командами IOS. Усе зберігається автоматично й синхронізується між пристроями.","ПК: ipconfig /static <IP> <маска> <шлюз> або ipconfig /dhcp + ipconfig /renew; ping, tracert, curl, ssh. Після ping натисніть «🔍 Шлях пакета»."]},N,ses,outs,cur,types,hist:(LAB&&LAB.hist)||[],hi:0,res:"",showSol:false};
  view="lab"; render(); }
function sbMutate(fn){ const d=CLI.saveNet(LAB.N,LAB.types); fn(d); d.ts=Date.now(); lsSet(LS.sandbox,d); if(store.mode==="db") queueWrite(()=>store.db.doc("sandbox/main").set({json:JSON.stringify(d),ts:Date.now()})); openSandbox(d); }
function sandboxEditor(){ const N=LAB.N; const names=Object.keys(N.dev);
  const opt=(arr,sel)=>arr.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
  const a=LAB.sbA||names[0], b=LAB.sbB||names[1];
  return `<div class="card"><h2>Пристрої та з'єднання</h2>
    <div class="row" style="flex-wrap:wrap;gap:6px"><button class="mini" data-act="sbadd" data-t="switch">+ 🔁 Комутатор</button><button class="mini" data-act="sbadd" data-t="l3">+ 🔁 L3-комутатор</button><button class="mini" data-act="sbadd" data-t="router">+ 🔀 Маршрутизатор</button><button class="mini" data-act="sbadd" data-t="pc">+ 💻 ПК</button><button class="mini" data-act="sbadd" data-t="server">+ 🗄 Сервер</button></div>
    ${names.length>=2?`<div class="sbl"><select id="sbA">${opt(names,a)}</select><select id="sbPA">${opt(CLI.freePorts(N,a))}</select><span>⟷</span><select id="sbB">${opt(names,b)}</select><select id="sbPB">${opt(CLI.freePorts(N,b))}</select><button class="primary mini" data-act="sblink">З'єднати</button></div>`:`<p class="small muted">Додайте щонайменше два пристрої.</p>`}
    ${N.links.length?`<details><summary class="small">З'єднання (${N.links.length})</summary>${N.links.map((l,k)=>`<div class="kv small"><span>${esc(l.a)} ${esc(l.pa)} ⟷ ${esc(l.b)} ${esc(l.pb)}</span><button class="mini ghost" data-act="sbunlink" data-k="${k}">✕</button></div>`).join("")}</details>`:""}
    ${names.length?`<details><summary class="small">Видалити пристрій</summary>${names.map(n=>`<div class="kv small"><span>${esc(n)}</span><button class="mini ghost" data-act="sbdel" data-n="${esc(n)}">✕</button></div>`).join("")}</details>`:""}</div>`; }
function openLab(id){
  const sc=ALLSCEN().find(s=>s.id===id); if(!sc) return;
  if(sc.net){ const {N,ses}=CLI.startNet(sc); const outs={}; for(const d of Object.keys(ses)) outs[d]= /^(pc|server)$/.test(N.dev[d].type)? "Microsoft Windows\n\n" : "\nPress RETURN to get started!\n\n";
    LAB={sc,N,ses,outs,cur:Object.keys(ses).find(d=>/^(pc|server)$/.test(N.dev[d].type))||Object.keys(ses)[0],hist:[],hi:0,res:"",showSol:false}; }
  else LAB={sc,N:null,ses:{[sc.hostname||"S1"]:CLI.startScenario(sc)},outs:{[sc.hostname||"S1"]:"\nPress RETURN to get started!\n\n"},cur:sc.hostname||"S1",hist:[],hi:0,res:"",showSol:false};
  view="lab"; render(); scrollTop();
}
function startTs(n){
  const pool=(CLI.NETSCEN||[]); let t=null, base=null;
  for(let k=0;k<10&&!t;k++){ base=pool[Math.floor(Math.random()*pool.length)]; t=CLI.troubleshoot(base,n); }
  if(!t){ alert("Не вдалося згенерувати поломку, спробуйте ще раз"); return; }
  const sc=Object.assign({},base,{id:"ts-"+base.id,title:"🛠 Знайди поломку: "+base.title,task:["Ця мережа була повністю налаштована й працювала. Потім щось зламали ("+(n>1?"кілька змін":"одна зміна")+").","Вимоги, які мають знову виконуватися:"].concat(base.check(CLI.solveNet(base)).map(x=>"• "+x[1])).concat(["Діагностуйте: ping/tracert з ПК, show ip interface brief, show run, show vlan brief, show interfaces trunk, show ip route, show ip ospf neighbor, show access-lists…"])});
  const outs={}; for(const d of Object.keys(t.ses)) outs[d]= /^(pc|server)$/.test(t.N.dev[d].type)? "Microsoft Windows\n\n" : "\nPress RETURN to get started!\n\n";
  LAB={sc,N:t.N,ses:t.ses,outs,cur:Object.keys(t.ses).find(d=>/^(pc|server)$/.test(t.N.dev[d].type))||Object.keys(t.ses)[0],hist:[],hi:0,res:"",showSol:false,ts:{n,faults:t.faults}};
  view="lab"; render(); scrollTop();
}
function checkLab(){
  const r= LAB.sc.net? LAB.sc.check(LAB.N) : LAB.sc.check(LAB.ses[LAB.cur].state); const ok=r.every(x=>x[0]);
  LAB.res=`<div class="card"><h2>${ok?"✅ Усе виконано!":"Ще не все"}</h2><ul class="checklist">${r.map(([v,t])=>`<li>${v?"✅":"❌"} ${esc(t)}</li>`).join("")}</ul></div>`;
  const prev=labs[LAB.sc.id]||{tries:0}; const rec={ok:ok||!!prev.ok, tries:(prev.tries||0)+1, ts:Date.now()}; if(ok&&!prev.ok) rec.done=Date.now();
  if(LAB.ts){ rec.solved=(prev.solved||0)+(ok&&!LAB.ts.done&&!LAB.showSol?1:0); if(ok) LAB.ts.done=true; }
  labs[LAB.sc.id]=rec; patch({labs:{[LAB.sc.id]:rec}}); $("#labres").innerHTML=LAB.res;
}

document.addEventListener("click", async ev=>{
  if(ev.target.closest("#home-link")){ if(view==="quiz"&&S&&S.mode==="exam") return; view="home"; S=null; render(); return; }
  const el=ev.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act;
  if(act==="topic"||act==="notesonly"||act==="match") return;
  if(act==="grp"){ const ts=TOPICS.filter(t=>t.g===el.dataset.g); const allOn=ts.every(t=>sel.has(t.id)); ts.forEach(t=>allOn?sel.delete(t.id):sel.add(t.id)); lsSet(LS.sel,[...sel]); render(); return; }
  if(act==="download"){ saveDownload("ccna-progress-"+dkey()+".json",exportJSON(),"application/json"); return; }
  if(act==="snapdl"){ const x=(window._snaps||[])[+el.dataset.i]; if(x) saveDownload("ccna-backup-"+new Date(x.ts).toISOString().slice(0,10)+".json",x.json,"application/json"); return; }
  if(act==="snaprestore"){ const x=(window._snaps||[])[+el.dataset.i]; if(!x) return; $("#imp").value=x.json; await backupAct("import",el); $("#snapmsg").textContent="Відновлено з копії від "+new Date(x.ts).toLocaleDateString("uk-UA"); return; }
  if(act==="snapnow"){ const snaps=lsGet(LS.snaps,[]); snaps.unshift({ts:Date.now(),n:Object.keys(prog).length,json:exportJSON()}); lsSet(LS.snaps,snaps.slice(0,4));
    if(store.mode==="db"){ try{ const meta=store.db.doc("backups/meta"); const m=await meta.get(); const md=m.exists?(m.data()||{}):{}; const slot=((md.slot||0)+1)%SNAP_KEEP; await store.db.doc("backups/s"+slot).set({ts:Date.now(),n:Object.keys(prog).length,json:exportJSON()}); await meta.set({last:Date.now(),slot}); remoteSnaps=await loadRemoteSnaps(); }catch(e){} }
    render(); return; }
  if(act==="ics"){ const t=($("#remtime")||{}).value||"19:00"; opts.remind=t; lsSet(LS.opts,opts); saveDownload("ccna-reminder.ics",makeICS(t),"text/calendar"); return; }
  if(act==="authgoogle"){ doAuth("google"); return; }
  if(act==="authlogin"){ doAuth("login"); return; }
  if(act==="authsignup"){ doAuth("signup"); return; }
  if(act==="logout"){ if(store.F) store.F.authM.signOut(store.F.auth); view="home"; render(); return; }
  if(act==="src"){ opts.src=el.dataset.v; lsSet(LS.opts,opts); render(); return; }
  if(act==="opt"){ opts[el.dataset.k]=Number(el.dataset.v); lsSet(LS.opts,opts); render(); return; }
  if(act==="train"){ startSession("train", pickTraining(sel, opts.train)); return; }
  if(act==="review"){ startSession("review", shuffle(reviewQueue())); return; }
  if(act==="obtrain"){ startSession("train", shuffle(customQs.filter(q=>q.type==="flash")).slice(0,opts.train), "Картки з нотаток"); return; }
  if(act==="install"){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); } return; }
  if(act==="installhide"){ opts.installHide=true; lsSet(LS.opts,opts); render(); return; }
  if(act==="ccna"){ const n=Number(el.dataset.n)||120; startSession("exam", pickCcna(n), n>=100?"CCNA 200-301":"CCNA (коротка)"); S.ccna=true; render(); return; }
  if(act==="plan"){ startPlan(); return; }
  if(act==="exam"){ const gk=genKeysFor(sel); const n=opts.exam; const ng=gk.length?Math.round(n*0.15):0; const list=shuffle(qsFor(sel).filter(q=>qtype(q)!=="flash")).slice(0,n-ng); for(let i=0;i<ng;i++){const g=GEN.make(gk[i%gk.length]); if(g) list.push(g);} startSession("exam", shuffle(list)); return; }
  if(act==="gen"){ const list=[]; for(let i=0;i<10;i++){ const g=GEN.make(el.dataset.k); if(g) list.push(g);} startSession("gen", list); return; }
  if(act==="cheat"){ const tid=($("#modsel")||{}).value||opts.modTopic; opts.modTopic=tid; lsSet(LS.opts,opts); view="cheat"; render(); scrollTop(); return; }
  if(act==="module2"){ startSession("module", pickModule(opts.modTopic), "Тест модуля "+tlabel(opts.modTopic)); return; }
  if(act==="module"){ const tid=($("#modsel")||{}).value||opts.modTopic; opts.modTopic=tid; lsSet(LS.opts,opts); startSession("module", pickModule(tid), "Тест модуля "+tlabel(tid)); return; }
  if(act==="setopt"){ const k=el.dataset.k; let v=el.dataset.v; if(v==="true"||v==="false") v=(v==="true"); else if(/^\d+$/.test(v)) v=Number(v); opts[k]=v; lsSet(LS.opts,opts); applyLook(); render(); return; }
  if(act==="cadd"){ customDraft=null; customEdit=null; render(); return; }
  if(act==="csave"){ saveCustom(); return; }
  if(act==="cedit"){ customEdit=el.dataset.id; render(); scrollTop(); return; }
  if(act==="cdel"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Точно видалити?"; return; } deleteCustom(el.dataset.id); return; }
  if(act==="caddopt"){ const f=readCustomForm(); f.o.push(["",""]); customDraft=f; render(); return; }
  if(act==="ctrain"){ const list=shuffle(customQs.filter(q=>TMAP[q.t])); startSession("train", list.slice(0,20), "Мої питання"); return; }
  if(["stats","backup","search","labs","custom","settings"].includes(act)){ view=act; render(); scrollTop(); if(act==="search"){const si=$("#searchin"); si&&si.focus();} if(act==="backup"&&store.mode==="db"&&remoteSnaps===null){ remoteSnaps=[]; loadRemoteSnaps().then(r=>{ remoteSnaps=r; if(view==="backup") render(); }); } return; }
  if(act==="lab"){ openLab(el.dataset.id); return; }
  if(act==="labcheck"){ checkLab(); return; }
  if(act==="labdev"){ LAB.cur=el.dataset.d; render(); return; }
  if(act==="walk"){ if(!LAB.N.lastFlow) return; LAB.walk={i:0,play:true}; render(); walkStop(); LAB.walk.play=true; walkTimer=setInterval(()=>{ if(!LAB||!LAB.walk){walkStop();return;} const n=walkSteps().length; if(LAB.walk.i>=n-1){ walkStop(); walkUpd(); return; } LAB.walk.i++; walkUpd(); },1300); walkUpd(); return; }
  if(act==="walkclose"){ walkStop(); LAB.walk=null; render(); return; }
  if(act==="walkplay"){ if(LAB.walk.play){ walkStop(); walkUpd(); return; } if(LAB.walk.i>=walkSteps().length-1) LAB.walk.i=0; LAB.walk.play=true; walkTimer=setInterval(()=>{ if(!LAB||!LAB.walk){walkStop();return;} if(LAB.walk.i>=walkSteps().length-1){ walkStop(); walkUpd(); return; } LAB.walk.i++; walkUpd(); },1300); walkUpd(); return; }
  if(act==="walkgo"){ walkStop(); const n=walkSteps().length; const d=el.dataset.d; LAB.walk.i= d==="first"?0 : d==="at"? Number(el.dataset.k) : Math.max(0,Math.min(n-1,LAB.walk.i+Number(d))); if(walkSteps()[LAB.walk.i].sep) LAB.walk.i=Math.min(n-1,LAB.walk.i+1); walkUpd(); return; }

  if(act==="obsexport"){ exportObsidian(); return; }
  if(act==="speed"){ speedStart(el.dataset.k); return; }
  if(act==="speedmenu"){ SP=null; view="speed"; render(); scrollTop(); return; }
  if(act==="speedquit"){ SP=null; render(); return; }
  if(act==="glossary"){ view="glossary"; render(); scrollTop(); return; }
  if(act==="enquiz"){ startSession("train", shuffle(QB.filter(q=>q.src==="en")).slice(0,opts.train), "English practice"); return; }
  if(act==="api"){ view="api"; render(); scrollTop(); return; }
  if(act==="apisend"){ apiSync(); API.res=APILAB.handle(API.st,API.req); apiDone(); render(); return; }
  if(act==="apitok"){ apiSync(); API.req.headers=API.req.headers.split("\n").filter(l=>!/^x-auth-token/i.test(l.trim())&&!/^authorization/i.test(l.trim())).concat(["X-Auth-Token: "+API.st.token]).join("\n"); render(); return; }
  if(act==="apireset"){ API=null; render(); return; }
  if(act==="apians"){ apiSync(); API.ans=$("#apians").value.trim(); if(API.ans===APILAB.TASKS.find(t=>t.id==="answer").ans) API.st.done.answer=true; else alert("Ні. Знайдіть пристрій із reachabilityStatus = Unreachable у відповіді GET /network-device."); apiDone(); render(); return; }
  if(act==="sbadd"){ const t=el.dataset.t; const pre={switch:"S",l3:"MLS",router:"R",pc:"PC",server:"SRV"}[t]; let k=1; while(LAB.N.dev[pre+k]) k++; sbMutate(d=>{ d.devs[pre+k]= t==="pc"||t==="server"? {type:t,services:t==="server"?[80,22,23]:[]} : {type:t}; }); return; }
  if(act==="sblink"){ const a=$("#sbA").value,b=$("#sbB").value,pa=$("#sbPA").value,pb=$("#sbPB").value; if(!pa||!pb||a===b){ alert("Оберіть два різні пристрої з вільними портами"); return; } sbMutate(d=>d.links.push([a,pa,b,pb])); return; }

  if(act==="sbreset"){ if(!confirm("Видалити всі пристрої з пісочниці?")) return; LAB.outs={}; sbMutate(d=>{ d.devs={}; d.links=[]; }); return; }
  if(act==="tsstart"){ startTs(Number(el.dataset.n)||1); return; }
  if(act==="tsgive"){ LAB.showSol=!LAB.showSol; render(); return; }
  if(act==="labsol"){ LAB.showSol=!LAB.showSol; render(); return; }
  if(act==="labreset"){ openLab(LAB.sc.id); return; }
  if(act==="home"||act==="quit"){ view="home"; S=null; render(); scrollTop(); return; }
  if(act==="flag"){ const id=el.dataset.id; const f=flags[id]&&flags[id].on; const rec=f?{on:false,ts:Date.now()}:{on:true,ts:Date.now(),snip:el.dataset.snip,note:""}; flags[id]=rec; patch({flags:{[id]:rec}}); rerenderInPlace(); return; }
  if(act==="flagnote"){ const id=el.dataset.id; const inp=el.parentElement.querySelector("input"); const rec=Object.assign({},flags[id],{note:inp.value.slice(0,500),ts:Date.now()}); flags[id]=rec; patch({flags:{[id]:rec}}); el.textContent="Збережено"; return; }
  if(act==="unflag"){ const id=el.dataset.id; const rec={on:false,ts:Date.now()}; flags[id]=rec; patch({flags:{[id]:rec}}); render(); return; }
  if(!S) { if(act==="copy"||act==="import"||act==="reset") return backupAct(act,el); return; }
  const k=S.i, q=S.items[k];
  if(act==="flashshow"){ S.reveal=S.i; render(); return; }
  if(act==="flash"){ S.ans[S.i]=el.dataset.v; doCheck(); return; }
  if(act==="pick"){ if(S.mode!=="exam"&&S.checked[k]) return; const i=Number(el.dataset.i); let ch=(S.ans[k]||[]).slice();
    if(q.a.length>1){ ch=ch.includes(i)?ch.filter(x=>x!==i):ch.concat(i); if(ch.length>q.a.length) ch.shift(); } else ch=[i];
    S.ans[k]=ch; S.confirmEnd=false; render(); return; }
  if(act==="ord"){ const i=Number(el.dataset.i); S.ans[k]=(S.ans[k]||[]).concat(i); S.confirmEnd=false; render(); return; }
  if(act==="unord"){ const i=Number(el.dataset.i); S.ans[k]=(S.ans[k]||[]).filter(x=>x!==i); render(); return; }
  if(act==="check"){ doCheck(); return; }
  if(act==="end2"){ finishExam(); return; }
  if(act==="next"){ if(S.mode!=="exam" && S.i>=S.items.length-1){ showSummary(); return; } S.i=Math.min(S.i+1,S.items.length-1); S.confirmEnd=false; render(); scrollTop(); return; }
  if(act==="prev"){ S.i=Math.max(0,S.i-1); S.confirmEnd=false; render(); scrollTop(); return; }
  if(act==="jump"){ S.i=Number(el.dataset.k); S.confirmEnd=false; render(); return; }
  if(act==="end"){ if(!S.confirmEnd){S.confirmEnd=true; render(); return;} finishExam(); return; }
  if(act==="copy"||act==="import"||act==="reset") return backupAct(act,el);
});
function rerenderInPlace(){ const y=window.scrollY; render(); try{window.scrollTo(0,y);}catch(e){} if(view==="stats") bindChart(); }
function doCheck(){ const k=S.i, q=S.items[k]; if(qtype(q)==="cmd"){ const ci=$("#cmdin"); if(ci) S.ans[k]=ci.value; } if(!hasAnswer(q,S.ans[k])) return; S.checked[k]=true; const ok=isCorrect(q,S.ans[k]); record(recId(q),ok); beep(ok); render(); }
let audioCtx=null;
function beep(ok){ if(!opts.sound) return; try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=ok?880:220; o.type=ok?"sine":"triangle"; g.gain.setValueAtTime(0.08,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+(ok?0.18:0.3)); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+(ok?0.2:0.32)); }catch(e){} }
function applyLook(){ const r=document.documentElement; if(opts.theme==="auto") delete r.dataset.theme; else r.dataset.theme=opts.theme; r.style.setProperty("--fs",(opts.fs||16)+"px"); }
document.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.act==="notesonly"){ opts.notesOnly=t.checked; lsSet(LS.opts,opts); render(); return; }
  if(t.dataset && t.dataset.act==="topic"){ t.checked?sel.add(t.dataset.t):sel.delete(t.dataset.t); lsSet(LS.sel,[...sel]); render(); return; }
  if((t.id==="obdir"||t.id==="obfiles")&&t.files&&t.files.length){ importMd([...t.files]); return; }
  if((t.id==="sbA"||t.id==="sbB")&&LAB){ LAB[t.id]=t.value; render(); return; }
  if(t.id==="examdate"){ opts.examDate=t.value; lsSet(LS.opts,opts); render(); return; }
  if(t.id==="cheatsel"){ opts.modTopic=t.value; lsSet(LS.opts,opts); render(); return; }
  if(t.dataset && t.dataset.act==="match" && S){ const k=S.i; const a=(S.ans[k]||[]).slice(); a[Number(t.dataset.i)]=t.value; S.ans[k]=a; S.confirmEnd=false; const y=window.scrollY; render(); try{window.scrollTo(0,y);}catch(e){} return; }
  if(t.id==="impfile" && t.files && t.files[0]){ const r=new FileReader(); r.onload=()=>{$("#imp").value=String(r.result);}; r.readAsText(t.files[0]); }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.classList&&t.classList.contains("fillin") && S){ const a=(S.ans[S.i]||[]).slice(); a[Number(t.dataset.i)]=t.value; S.ans[S.i]=a; const b=$("#checkbtn"); if(b) b.disabled=!hasAnswer(S.items[S.i],a); const dots=document.querySelectorAll(".dots span"); if(dots[S.i]) dots[S.i].classList.toggle("done",hasAnswer(S.items[S.i],a)); }
  if(t.id==="cmdin" && S){ S.ans[S.i]=t.value; const b=$("#checkbtn"); if(b) b.disabled=!t.value.trim(); const dots=document.querySelectorAll(".dots span"); if(dots[S.i]) dots[S.i].classList.toggle("done",!!t.value.trim()); }
  if(t.id==="glq"){ window._glq=t.value; const pos=t.selectionStart; render(); const g=$("#glq"); if(g){ g.focus(); g.setSelectionRange(pos,pos); } return; }
  if(t.id==="searchin"){ searchQ=t.value; const pos=t.selectionStart; render(); const si=$("#searchin"); si.focus(); try{si.setSelectionRange(pos,pos);}catch(e){} }
});
document.addEventListener("keydown", ev=>{ if(ev.target.id==="cmdin" && ev.key==="Enter" && S){ ev.preventDefault(); if(S.mode==="exam"){ S.ans[S.i]=ev.target.value; if(S.i<S.items.length-1){S.i++; render();} } else if(!S.checked[S.i]) doCheck(); else { if(S.i>=S.items.length-1) showSummary(); else {S.i++; render();} } } });
function showSummary(){
  let ok=0,n=0; S.items.forEach((q,k)=>{ if(S.checked[k]){ n++; if(isCorrect(q,S.ans[k])) ok++; } });
  $("#app").innerHTML=`<div class="card"><h2>Сесію завершено</h2><p class="big">${ok}/${n}</p><p class="muted">Питання з помилками з'являться в «Повторі помилок».</p></div>
    <div class="card"><h2>Розбір</h2>${S.items.map((q,k)=>S.checked[k]?reviewItem(q,S.ans[k]):"").join("")}</div><button class="primary" data-act="home">На головну</button>`;
  view="summary"; scrollTop();
}
async function backupAct(act,el){
  if(act==="copy"){ const t=$("#exp"); try{ await navigator.clipboard.writeText(t.value); $("#copymsg").textContent="Скопійовано"; }catch(e){ t.focus(); t.select(); $("#copymsg").textContent="Виділено — скопіюйте вручну"; } return; }
  if(act==="import"){ const msg=$("#impmsg"); try{ const d=JSON.parse($("#imp").value); if(!d||typeof d.progress!=="object") throw new Error("Немає поля progress");
      prog=mergeByTs(prog,d.progress,"l"); daily=mergeDaily(daily,d.daily||{}); flags=mergeByTs(flags,d.flags||{},"ts"); labs=mergeByTs(labs,d.labs||{},"ts"); saveAll();
      if(Array.isArray(d.custom)){ for(const q of d.custom){ if(q&&q.id&&q.t&&Array.isArray(q.o)&&!customQs.some(x=>x.id===q.id)){ customQs.push(q); if(store.mode==="db") queueWrite(()=>store.db.doc("custom/"+q.id).set(q)); } } lsSet(LS.custom,customQs); rebuildQB(); }
      if(Array.isArray(d.exams)){ const have=new Set(exams.map(e=>e.ts)); for(const e of d.exams){ if(e&&e.ts&&!have.has(e.ts)){ exams.push(e); if(store.mode==="db") queueWrite(()=>store.db.collection("exams").add(e)); } } exams.sort((a,b)=>b.ts-a.ts); lsSet(LS.exams,exams); }
      msg.textContent="Імпортовано: "+Object.keys(d.progress).length+" записів"; }catch(e){ msg.textContent="Помилка: "+e.message; } return; }
  if(act==="reset"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Точно скинути? Натисніть ще раз"; el.classList.add("primary"); return; } prog={}; saveAll(); el.textContent="Скинуто"; el.disabled=true; }
}

customQs=lsGet(LS.custom,[]); rebuildQB(); applyLook();
render();
initStore(); setTimeout(()=>{ if(store.mode!=="db") autoBackup(); },8000);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
addEventListener("online",setStatus); addEventListener("offline",setStatus);
var installEvt=null; addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(view==="home") render(); });
addEventListener("appinstalled",()=>{ installEvt=null; opts.installed=true; lsSet(LS.opts,opts); if(view==="home") render(); });
function standalone(){ return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }
function installCard(){ if(standalone()||opts.installHide) return "";
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!installEvt&&!ios) return "";
  return `<div class="card"><div class="row"><h2 class="grow" style="margin:0">📲 Встановити на пристрій</h2><button class="mini ghost" data-act="installhide">✕</button></div><p class="small muted" style="margin:6px 0 8px">Тренажер відкриватиметься як застосунок з іконкою, працюватиме без інтернету (питання, лаби, генератори), а прогрес синхронізується, коли зв'язок повернеться.</p>${installEvt?`<button class="primary" data-act="install">Встановити</button>`:`<p class="small" style="margin:0">iPhone/iPad: у Safari натисніть «Поділитися» → «На початковий екран».</p>`}</div>`; }
</script>
</body>
